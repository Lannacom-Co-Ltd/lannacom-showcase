<!doctype html>
<!-- ไฟล์นี้คือแม่แบบ — showcase/index.html สร้างจากมันด้วย `node tools/build-showcase.js` (แทนที่ {{...}} ด้วยมาร์กอัปจริงของหน้า 3D ใน public/index.html) -->
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lannacom Live Showcase</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="twin.css">
</head>
<body>
<div id="stage">
<header class="topbar">
  <!-- มือถือ: แตะโลโก้เพื่อเปิดแผงเมนูเลื่อนซ้าย (#panelDrawer) — บน desktop โลโก้เป็นแค่โลโก้เฉยๆ ดู syncPanelLocation/openDrawer ใน app.js -->
  <div class="brand" id="brandMenuBtn" role="button" tabindex="0" aria-label="Open menu" aria-expanded="false">
    <span class="brand-mark">
      <svg width="22" height="15" viewBox="0 0 46 30" aria-hidden="true">
        <circle cx="13" cy="13" r="13" fill="#36b34a"/>
        <rect x="24" y="2" width="22" height="22" rx="4" fill="#f0571f"/>
      </svg>
    </span>
    <div class="brand-text">
      <div class="brand-word">lannacom</div>
      <div class="brand-name">Smart Building Digital Twin</div>
    </div>
  </div>

  <div class="topbar-mid">
    <!-- มือถือเท่านั้น: ชิปย่อ % พลังงานสะอาด แตะแล้วเปิดแผงเมนูซ้ายตรงไปหัวข้อ SUSTAINABILITY เลย — ดู openPanelDrawerToSustain ใน app.js -->
    <button id="susTopbarChip" class="topbar-sus-chip" type="button" aria-label="Sustainability"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-11 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg> <span id="susTopbarValue">--%</span></button>
    <!-- ปุ่มสภาพอากาศ (แทนนาฬิกาเดิม): ไอคอน + สภาพ + อุณหภูมิ + เวลา — กดเปิดแผง สด / จำลอง / ปิด (ดู section WEATHER ใน app.js) -->
    <div id="wxWidget" class="wx-widget">
      <button id="wxPill" class="wx-pill" type="button" aria-expanded="false" aria-controls="wxPanel"></button>
      <div id="wxPanel" class="wx-panel hidden" role="dialog"></div>
    </div>
    <div id="viewToggle" class="view-toggle">
      <button data-mode="3d" class="active">3D</button>
      <button data-mode="data">Data</button>
    </div>
    <div class="bell-wrap">
      <button id="alertsBtn" class="icon-btn" aria-label="View alerts" title="View alerts" data-i18n-title="topbar.alerts" aria-expanded="false">
        <svg class="hud-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="menu-row-label" data-i18n="topbar.alerts">View alerts</span>
        <span class="icon-badge hidden" id="alertsBadge">0</span>
      </button>
      <div id="alertsDropdown" class="alerts-dropdown hidden">
        <div class="ad-head"><span data-i18n="alerts.title">ALERTS</span> <span id="alertsDdCount" class="ad-count">0</span></div>
        <div id="alertList" class="alert-list"></div>
      </div>
    </div>
    <div class="settings-wrap">
      <button id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings" data-i18n-title="topbar.settings" aria-expanded="false">
        <svg class="hud-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="menu-row-label" data-i18n="topbar.settings">Settings</span>
      </button>
    </div>
    <div class="chat-toggle-wrap">
      <button id="chatToggleBtn" class="chat-toggle-btn" type="button" aria-label="Digital Twin Assistant" title="Digital Twin Assistant" data-i18n-title="chat.tooltip">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="12" r="7" fill="currentColor"/><rect x="10.5" y="6" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        <span class="menu-row-label" data-i18n="chat.tooltip">Digital Twin Assistant</span>
        <span id="chatBadge" class="chat-badge hidden"><span class="chat-badge-ring"></span></span>
      </button>
    </div>
    <button id="langBtn" class="lang-btn" type="button" title="Switch language" aria-label="Switch language">EN</button>
    <!-- มือถือเท่านั้น: ปุ่ม ☰ เปิดแผงเมนูขวา (#utilityDrawer) รวมกระดิ่ง/เกียร์/แชท/ภาษา — ดู syncUtilityLocation ใน app.js -->
    <button id="utilityMenuBtn" class="icon-btn utility-menu-btn" type="button" aria-label="Open menu" aria-expanded="false">
      <svg class="hud-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</header>
<div id="appBody">
<div id="appMain">
<main id="viewport">
  <div id="levelList" class="level-float"></div>
</main>
<aside class="panel-col left">
  <section class="panel">
    <div class="panel-head">
      <span class="panel-title" id="efPanelTitle">CARBON FOOTPRINT</span>
      <button type="button" class="pill mode-toggle carbon" id="efModeBtn" title="Switch between energy and carbon view">
        <span class="dot" id="efModeDot" style="background:var(--cyan)"></span><span id="efModeText">Carbon</span>
      </button>
    </div>
    <div class="energy-flow" id="energyFlowWrap">
      <div class="energy-donut" id="energyDonut"></div>
      <div class="kv mono" id="energyRows"></div>
    </div>
    <div class="today-consume">
      <div class="tc-title" id="tcTitle">TODAY CARBON</div>
      <div class="tc-bar" id="tcBar"></div>
      <div class="tc-legend" id="tcLegend"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="panel-title" data-i18n="panel.environment">ENVIRONMENT</span>
      <span class="pill good clickable" id="comfortPill">COMFORT: --%</span>
    </div>
    <div class="grid2" id="envGrid"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="panel-title" data-i18n="panel.equipmentHealth">EQUIPMENT HEALTH</span>
      <span class="pill" id="eqTotal">-- UNITS</span>
    </div>
    <div class="eq-grid" id="eqHealth"></div>
  </section>
</aside>
<aside class="panel-col right">
  <section class="panel" id="systemPanel">
    <div class="panel-head">
      <span class="panel-head-left"><span class="panel-title" data-i18n="panel.system">SYSTEM</span></span>
    </div>
    <div class="panel-body">
      <div class="chips" id="categoryChips"></div>
      <div class="panel-head" style="margin-top:10px"><span class="panel-title" data-i18n="panel.overlays">OVERLAYS</span></div>
      <div class="chips" id="overlayChips">
        <button class="chip chip-icon" id="clayBtn" data-i18n-title="chip.clayTip">
          <svg class="chip-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg><span data-i18n="chip.clay">Clay view</span>
        </button>
        <button class="chip chip-icon" id="siteCtxBtn" data-i18n-title="chip.siteCtxTip">
          <svg class="chip-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span data-i18n="chip.siteCtx">Surroundings</span>
        </button>
        <button class="chip chip-icon" id="fogBtn" data-i18n-title="chip.fogTip">
          <svg class="chip-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 10a5.5 5.5 0 0 0-10.7-1.5A4.5 4.5 0 0 0 7 17h10.5a3.5 3.5 0 0 0 0-7z" transform="translate(0 -3)"/><path d="M4 20h16M7 23h10" transform="translate(0 -2)"/></svg><span data-i18n="chip.fog">Fog</span>
        </button>
        <button class="chip chip-icon" id="autoRotateBtn">
          <svg class="chip-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/></svg><span data-i18n="chip.autorotate">Auto-rotate</span>
        </button>
        <button class="chip chip-icon" id="deviceEditBtn" title="Add and move equipment location markers. Locked when off.">
          <svg class="chip-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span data-i18n="chip.editMarkers">Edit markers</span>
        </button>
        <button class="chip chip-icon" id="powerSimBtn" title="Simulate a power outage at LC-Main or the PoE switch going down, and see what is affected">
          <svg class="chip-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/><line x1="3" y1="3" x2="21" y2="21"/></svg><span data-i18n="chip.powerSim">Simulate</span>
        </button>
      </div>
    </div>
  </section>

  <section class="panel" id="sustainPanel">
    <div class="panel-head">
      <span class="panel-head-left">
        <span class="panel-title" data-i18n="panel.sustainability">SUSTAINABILITY</span>
        <span class="pill good" id="susBadge">SOLAR --%</span>
      </span>
    </div>
    <div class="panel-body">
      <div class="sus-subtitle" id="susSubtitle"></div>
      <div class="tc-bar" id="susBar"></div>
      <div class="tc-legend" id="susLegend"></div>
      <div class="grid2 sus-grid" id="susGrid" style="margin-top:10px"></div>
    </div>
  </section>
</aside>
<nav class="viewbar">
  <button data-view="overview" class="active" data-i18n="view.overview">Overview</button>
  <button data-view="top" data-i18n="view.top">Top</button>
  <button data-view="front" data-i18n="view.front">Front</button>
  <button data-view="side" data-i18n="view.side">Side</button>
</nav>
<div id="scStale" class="sc-hidden"></div>
<div id="scCredit">© OpenStreetMap contributors (ODbL) · Microsoft building footprints (ODbL) · ESA WorldCover 2021 (CC BY 4.0)</div>
</div>
</div>
</div>
<script src="config.js"></script>
<script src="twin-ui.js"></script>
<script src="showcase.js"></script>
</body>
</html>
